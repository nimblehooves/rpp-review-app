<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Локальный прототип системы ревью сотрудников" />
    <title>Контур — ревью сотрудников</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231a3c34'/%3E%3Cpath d='M18 20h28v7H25v10h17v7H18z' fill='%23d7f56a'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Основная навигация">
        <div class="brand">
          <span class="brand-mark">К</span>
          <div><strong>Контур</strong><small>Ревью команды</small></div>
        </div>
        <nav id="main-nav"></nav>
        <div class="sidebar-note">
          <span>Локальный прототип</span>
          <p>Данные сохраняются только в этом браузере.</p>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <button class="mobile-menu" id="mobile-menu" aria-label="Открыть меню">☰</button>
          <div class="page-heading"><p id="page-eyebrow"></p><h1 id="page-title">Обзор</h1></div>
          <label class="identity-switcher">
            <span>Режим просмотра</span>
            <select id="identity-select" aria-label="Выберите пользователя"></select>
          </label>
        </header>
        <section id="app" class="content" aria-live="polite"></section>
      </main>
    </div>

    <dialog id="new-review-dialog">
      <form method="dialog" id="new-review-form" class="dialog-card">
        <div class="dialog-head"><div><p class="eyebrow">Новое ревью</p><h2>Начать период</h2></div><button value="cancel" class="icon-button" aria-label="Закрыть">×</button></div>
        <label>Сотрудник<select name="employeeId" id="new-review-employee" required></select></label>
        <label>Период<input name="period" value="2 полугодие 2026" required /></label>
        <label>Дата встречи<input name="reviewDate" type="date" required /></label>
        <div class="dialog-actions"><button value="cancel" class="button secondary">Отмена</button><button value="default" class="button primary" id="create-review-submit">Создать ревью</button></div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status"></div>
    <script src="./app.js"></script>
  </body>
</html>
